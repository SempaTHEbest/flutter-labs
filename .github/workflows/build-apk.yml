name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lab: [lab6, lab7]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
      - name: Build release APK
        working-directory: ${{ matrix.lab }}
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.lab }}-apk
          path: ${{ matrix.lab }}/build/app/outputs/flutter-apk/app-release.apk
